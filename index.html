<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>천국을 향한 하나된 여정 퍼즐</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>

  <div class="container">
    <h1>✨ 하나된 여정 퍼즐 트래커</h1>
    <div class="progress-info">
      <span>진행률: <strong id="count">0</strong> / <span id="total-count">40</span></span>
      <div class="progress-bar">
        <div id="fill"></div>
      </div>
    </div>

    <!-- 퍼즐 그리드 (CSS에서 배경 이미지 설정) -->
    <div id="puzzle-grid" class="puzzle-grid"></div>

    <div class="controls">
      <button id="resetBtn">초기화</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
